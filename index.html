<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07120c">
  <title>Freecash – Angebote entdecken</title>
  <style>
    :root{--bg:#050a07;--bg2:#0b1510;--card:#0f1d15;--line:rgba(255,255,255,.10);--green:#34ff8b;--green2:#19d86a;--text:#f4fff7;--muted:#aac2b4;--shadow:0 24px 70px rgba(0,0,0,.45)}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at top, rgba(52,255,139,.18), transparent 32%),linear-gradient(180deg,#09110c 0%,#040705 80%)}
    a{text-decoration:none;color:inherit}.page{max-width:430px;margin:0 auto;min-height:100svh;padding:22px 16px;display:flex;align-items:center}.card{width:100%;padding:28px 22px;background:linear-gradient(180deg,rgba(13,26,19,.98),rgba(6,11,8,.99));border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);text-align:center}
    .logo{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:22px}.logo img{width:56px;height:56px;border-radius:16px;object-fit:cover}.logo strong{font-size:28px;letter-spacing:-.04em;color:var(--green)}
    .badge{display:inline-flex;padding:8px 12px;border-radius:999px;background:rgba(52,255,139,.10);border:1px solid rgba(52,255,139,.24);color:#b8ffd2;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px}
    h1{margin:0 0 12px;font-size:34px;line-height:1.02;letter-spacing:-.05em}.accent{color:var(--green)}
    p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}.desc{margin-bottom:22px}
    .btns{display:grid;gap:11px}.btn{min-height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;padding:0 16px}.primary{background:linear-gradient(180deg,#3dff93,#1ad86c);color:#041009;box-shadow:0 18px 34px rgba(26,216,108,.22)}.secondary{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#edf8f1}
    .foot{margin-top:18px;font-size:12px;color:#8ca596}.foot a{color:#d6ffe5}
  </style>
</head>
<body>
  <div class="page">
    <main class="card">
      <div class="logo"><img src="assets/freecash-logo.png" alt="Freecash"><strong>Freecash</strong></div>
      <div class="badge">Spiele & Prämien</div>
      <h1>Spiele testen,<br><span class="accent">Prämien entdecken</span></h1>
      <p class="desc">Entdecke Angebote für Spiele und Apps, informiere dich über verfügbare Prämien und erfahre auf der nächsten Seite, wie es funktioniert.</p>
      <div class="btns">
        <a class="btn primary" href="lander/index.html">Jetzt Angebote ansehen →</a>
        <a class="btn secondary" href="lander/index.html">Weitere Informationen</a>
      </div>
      <div class="foot"><a href="https://freecash.com/en" target="_blank" rel="noopener noreferrer">Offizielle Website</a></div>
    </main>
  </div>
</body>
</html>
